name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Create disposable CI signing key
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore build/ci-release.jks -storepass ci-temporary-password -keypass ci-temporary-password -alias lynos-ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=LynOS CI,O=LynOS,C=ID"
          echo "LYNOS_KEYSTORE=$GITHUB_WORKSPACE/build/ci-release.jks" >> "$GITHUB_ENV"
          echo "LYNOS_STORE_PASSWORD=ci-temporary-password" >> "$GITHUB_ENV"
          echo "LYNOS_KEY_PASSWORD=ci-temporary-password" >> "$GITHUB_ENV"
          echo "LYNOS_KEY_ALIAS=lynos-ci" >> "$GITHUB_ENV"

      - name: Assemble installable release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signatures
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LynOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed CI release APK
        uses: actions/upload-artifact@v4
        with:
          name: LynOS-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
